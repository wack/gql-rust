[package]
name = "slcr-gql"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only GQL query profile for the SLCR specification graph"

[dependencies]
chumsky = "=0.13.0"
grafeo = { version = "=0.5.42", default-features = false, features = ["gql", "lpg"], optional = true }
petgraph = "=0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"

[[test]]
name = "tck"
harness = false

[features]
grafeo = ["dep:grafeo"]
